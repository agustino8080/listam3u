name: Limpieza de Archivos M3U

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Mostrar estructura del repositorio
        run: |
          echo "📁 Estructura actual del repositorio:"
          ls -lah
          echo ""
          echo "📋 Archivos M3U encontrados:"
          find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) -ls || echo "No se encontraron archivos M3U"
      
      - name: Configurar Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      
      - name: Detectar archivos para limpiar
        id: detect
        run: |
          echo "========================================"
          echo "INICIANDO DETECCION DE ARCHIVOS"
          echo "========================================"
          
          mkdir -p reports
          
          TEMP_FILES=""
          if find . -type f \( -name "*-temp-*" -o -name "temp-*" -o -name "*.tmp" \) ! -path "./.git/*" 2>/dev/null | grep -q .; then
            TEMP_FILES=$(find . -type f \( -name "*-temp-*" -o -name "temp-*" -o -name "*.tmp" \) ! -path "./.git/*" 2>/dev/null)
          fi
          
          if [ -z "$TEMP_FILES" ]; then
            TEMP_COUNT=0
          else
            TEMP_COUNT=$(echo "$TEMP_FILES" | wc -l)
          fi
          
          echo "Temporales encontrados: $TEMP_COUNT"
          if [ $TEMP_COUNT -gt 0 ]; then
            echo "$TEMP_FILES"
          fi
          
          OLD_M3U=""
          if find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) -mtime +30 ! -path "./.git/*" 2>/dev/null | grep -q .; then
            OLD_M3U=$(find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) -mtime +30 ! -path "./.git/*" 2>/dev/null)
          fi
          
          if [ -z "$OLD_M3U" ]; then
            OLD_COUNT=0
          else
            OLD_COUNT=$(echo "$OLD_M3U" | wc -l)
          fi
          
          echo "Antiguos encontrados: $OLD_COUNT"
          if [ $OLD_COUNT -gt 0 ]; then
            echo "$OLD_M3U"
          fi
          
          TOTAL=$((TEMP_COUNT + OLD_COUNT))
          
          echo "========================================"
          echo "RESUMEN DE DETECCION"
          echo "========================================"
          echo "Archivos temporales: $TEMP_COUNT"
          echo "Archivos antiguos: $OLD_COUNT"
          echo "TOTAL A ELIMINAR: $TOTAL"
          echo "========================================"
          
          echo "$TEMP_FILES" > reports/temp_files.txt
          echo "$OLD_M3U" > reports/old_files.txt
          
          echo "temp_count=${TEMP_COUNT}" >> $GITHUB_OUTPUT
          echo "old_count=${OLD_COUNT}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
      
      - name: Generar reporte detallado
        if: steps.detect.outputs.total != '0'
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          REPORT="reports/cleanup_report_${TIMESTAMP}.md"
          
          echo "# Reporte de Limpieza Automatica" > "$REPORT"
          echo "" >> "$REPORT"
          echo "**Fecha:** $(date)" >> "$REPORT"
          echo "**Total archivos a eliminar:** ${{ steps.detect.outputs.total }}" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "## Detalles" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "### Archivos Temporales (${{ steps.detect.outputs.temp_count }})" >> "$REPORT"
          echo '```' >> "$REPORT"
          cat reports/temp_files.txt >> "$REPORT"
          echo '```' >> "$REPORT"
          echo "" >> "$REPORT"
          echo "### Archivos Antiguos (${{ steps.detect.outputs.old_count }})" >> "$REPORT"
          echo '```' >> "$REPORT"
          cat reports/old_files.txt >> "$REPORT"
          echo '```' >> "$REPORT"
          
          echo "REPORT=${REPORT}" >> $GITHUB_ENV
          
          echo "========================================"
          echo "REPORTE GENERADO"
          echo "========================================"
          cat "$REPORT"
      
      - name: Eliminar archivos
        if: steps.detect.outputs.total != '0'
        run: |
          echo "========================================"
          echo "INICIANDO ELIMINACION"
          echo "========================================"
          
          DELETED=0
          FAILED=0
          
          if [ -s reports/temp_files.txt ]; then
            while IFS= read -r file; do
              if [ -n "$file" ] && [ -f "$file" ]; then
                echo "Eliminando: $file"
                if git rm -f "$file" 2>/dev/null; then
                  echo "  Eliminado correctamente"
                  DELETED=$((DELETED + 1))
                else
                  echo "  Error al eliminar"
                  FAILED=$((FAILED + 1))
                fi
              fi
            done < reports/temp_files.txt
          fi
          
          if [ -s reports/old_files.txt ]; then
            while IFS= read -r file; do
              if [ -n "$file" ] && [ -f "$file" ]; then
                echo "Eliminando: $file"
                if git rm -f "$file" 2>/dev/null; then
                  echo "  Eliminado correctamente"
                  DELETED=$((DELETED + 1))
                else
                  echo "  Error al eliminar"
                  FAILED=$((FAILED + 1))
                fi
              fi
            done < reports/old_files.txt
          fi
          
          echo "========================================"
          echo "RESULTADO DE ELIMINACION"
          echo "========================================"
          echo "Eliminados correctamente: $DELETED"
          echo "Errores: $FAILED"
          echo "========================================"
          
          echo "DELETED=${DELETED}" >> $GITHUB_ENV
          echo "FAILED=${FAILED}" >> $GITHUB_ENV
      
      - name: Commit y push
        if: steps.detect.outputs.total != '0' && env.DELETED != '0'
        run: |
          git add reports/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "Limpieza automatica - ${DELETED} archivos eliminados" || true
            git push || echo "No se pudo hacer push"
          fi
      
      - name: Subir reportes
        if: steps.detect.outputs.total != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
      
      - name: Resumen final
        if: always()
        run: |
          TEMP_COUNT="${{ steps.detect.outputs.temp_count }}"
          OLD_COUNT="${{ steps.detect.outputs.old_count }}"
          TOTAL="${{ steps.detect.outputs.total }}"
          DELETED="${DELETED:-0}"
          FAILED="${FAILED:-0}"
          
          {
            echo "## Limpieza de Archivos M3U"
            echo ""
            
            if [ "$TOTAL" = "0" ] || [ -z "$TOTAL" ]; then
              echo "No se encontraron archivos para limpiar"
              echo ""
              echo "El repositorio esta limpio. No hay:"
              echo "- Archivos temporales (*-temp-*, temp-*, *.tmp)"
              echo "- Archivos M3U antiguos (mas de 30 dias sin modificar)"
              echo ""
              echo "**Proxima ejecucion:** Manana a las 9:00 AM"
            else
              echo "| Metrica | Valor |"
              echo "|---------|-------|"
              echo "| Temporales detectados | ${TEMP_COUNT} |"
              echo "| Antiguos detectados | ${OLD_COUNT} |"
              echo "| Total detectado | ${TOTAL} |"
              echo "| Eliminados exitosamente | ${DELETED} |"
              echo "| Errores al eliminar | ${FAILED} |"
            fi
            
            echo ""
            echo "---"
            echo "**Ejecutado:** $(date)"
          } >> $GITHUB_STEP_SUMMARY
