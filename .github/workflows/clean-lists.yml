name: Limpieza de Archivos M3U

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Mostrar estructura del repositorio
        run: |
          echo "📁 Estructura actual del repositorio:"
          ls -lah
          echo ""
          echo "📋 Archivos M3U encontrados:"
          find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) -ls || echo "No se encontraron archivos M3U"
      
      - name: Configurar Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      
      - name: Detectar archivos para limpiar
        id: detect
        run: |
          echo "========================================"
          echo "🔍 INICIANDO DETECCIÓN DE ARCHIVOS"
          echo "========================================"
          
          mkdir -p reports
          
          # Archivos temporales
          echo "Buscando archivos temporales..."
          TEMP_FILES=""
          if find . -type f \( -name "*-temp-*" -o -name "temp-*" -o -name "*.tmp" \) ! -path "./.git/*" 2>/dev/null | grep -q .; then
            TEMP_FILES=$(find . -type f \( -name "*-temp-*" -o -name "temp-*" -o -name "*.tmp" \) ! -path "./.git/*" 2>/dev/null)
          fi
          
          if [ -z "$TEMP_FILES" ]; then
            TEMP_COUNT=0
          else
            TEMP_COUNT=$(echo "$TEMP_FILES" | wc -l)
          fi
          
          echo "✅ Temporales encontrados: $TEMP_COUNT"
          if [ $TEMP_COUNT -gt 0 ]; then
            echo "$TEMP_FILES"
          fi
          echo ""
          
          # Archivos antiguos (30+ días)
          echo "Buscando archivos M3U antiguos (30+ días)..."
          OLD_M3U=""
          if find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) -mtime +30 ! -path "./.git/*" 2>/dev/null | grep -q .; then
            OLD_M3U=$(find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) -mtime +30 ! -path "./.git/*" 2>/dev/null)
          fi
          
          if [ -z "$OLD_M3U" ]; then
            OLD_COUNT=0
          else
            OLD_COUNT=$(echo "$OLD_M3U" | wc -l)
          fi
          
          echo "✅ Antiguos encontrados: $OLD_COUNT"
          if [ $OLD_COUNT -gt 0 ]; then
            echo "$OLD_M3U"
          fi
          echo ""
          
          # Total
          TOTAL=$((TEMP_COUNT + OLD_COUNT))
          
          echo "========================================"
          echo "📊 RESUMEN DE DETECCIÓN"
          echo "========================================"
          echo "🗑️  Archivos temporales: $TEMP_COUNT"
          echo "⏰  Archivos antiguos: $OLD_COUNT"
          echo "📦  TOTAL A ELIMINAR: $TOTAL"
          echo "========================================"
          
          # Guardar para siguiente paso
          echo "$TEMP_FILES" > reports/temp_files.txt
          echo "$OLD_M3U" > reports/old_files.txt
          
          # Outputs (corregidos)
          echo "temp_count=${TEMP_COUNT}" >> $GITHUB_OUTPUT
          echo "old_count=${OLD_COUNT}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
      
      - name: 📝 Generar reporte detallado
        if: steps.detect.outputs.total != '0'
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          REPORT="reports/cleanup_report_${TIMESTAMP}.md"
          
          cat > "$REPORT" << 'EOF'
# 🧹 Reporte de Limpieza Automática

**Fecha:** $(date)
**Total archivos a eliminar:** ${{ steps.detect.outputs.total }}

## 📊 Detalles

### 🗑️ Archivos Temporales (${{ steps.detect.outputs.temp_count }})
EOF
          
          echo '```' >> "$REPORT"
          cat reports/temp_files.txt >> "$REPORT"
          echo '```' >> "$REPORT"
          
          echo "" >> "$REPORT"
          echo "### ⏰ Archivos Antiguos (${{ steps.detect.outputs.old_count }})" >> "$REPORT"
          echo '```' >> "$REPORT"
          cat reports/old_files.txt >> "$REPORT"
          echo '```' >> "$REPORT"
          
          echo "REPORT=${REPORT}" >> $GITHUB_ENV
          
          echo "========================================"
          echo "📄 REPORTE GENERADO"
          echo "========================================"
          cat "$REPORT"
      
      - name: 🗑️ Eliminar archivos
        if: steps.detect.outputs.total != '0'
        run: |
          echo "========================================"
          echo "🗑️  INICIANDO ELIMINACIÓN"
          echo "========================================"
          
          DELETED=0
          FAILED=0
          
          # Procesar archivos temporales
          if [ -s reports/temp_files.txt ]; then
            while IFS= read -r file; do
              if [ -n "$file" ] && [ -f "$file" ]; then
                echo "Eliminando: $file"
                if git rm -f "$file" 2>/dev/null; then
                  echo "  ✅ Eliminado"
                  DELETED=$((DELETED + 1))
                else
                  echo "  ❌ Error"
                  FAILED=$((FAILED + 1))
                fi
              fi
            done < reports/temp_files.txt
          fi
          
          # Procesar archivos antiguos
          if [ -s reports/old_files.txt ]; then
            while IFS= read -r file; do
              if [ -n "$file" ] && [ -f "$file" ]; then
                echo "Eliminando: $file"
                if git rm -f "$file" 2>/dev/null; then
                  echo "  ✅ Eliminado"
                  DELETED=$((DELETED + 1))
                else
                  echo "  ❌ Error"
                  FAILED=$((FAILED + 1))
                fi
              fi
            done < reports/old_files.txt
          fi
          
          echo "========================================"
          echo "📊 RESULTADO DE ELIMINACIÓN"
          echo "========================================"
          echo "✅ Eliminados correctamente: $DELETED"
          echo "❌ Errores: $FAILED"
          echo "========================================"
          
          echo "DELETED=${DELETED}" >> $GITHUB_ENV
          echo "FAILED=${FAILED}" >> $GITHUB_ENV
      
      - name: 💾 Commit y push
        if: steps.detect.outputs.total != '0' && env.DELETED != '0'
        run: |
          git add reports/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "🧹 Limpieza automática - ${DELETED} archivos eliminados" || true
            git push || echo "⚠️  No se pudo hacer push"
          fi
      
      - name: 📦 Subir reportes
        if: steps.detect.outputs.total != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
      
      - name: ✅ Resumen final
        if: always()
        run: |
          TEMP_COUNT="${{ steps.detect.outputs.temp_count }}"
          OLD_COUNT="${{ steps.detect.outputs.old_count }}"
          TOTAL="${{ steps.detect.outputs.total }}"
          DELETED="${DELETED:-0}"
          FAILED="${FAILED:-0}"
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🧹 Limpieza de Archivos M3U
          
          EOF
          
          if [ "$TOTAL" = "0" ] || [ -z "$TOTAL" ]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ✅ **No se encontraron archivos para limpiar**
          
          El repositorio está limpio. No hay:
          - ❌ Archivos temporales (*-temp-*, temp-*, *.tmp)
          - ❌ Archivos M3U antiguos (más de 30 días sin modificar)
          
          **Próxima ejecución programada:** Mañana a las 9:00 AM
          EOF
          else
            cat >> $GITHUB_STEP_SUMMARY << EOF
          | Métrica | Valor |
          |---------|-------|
          | 🗑️ Temporales detectados | ${TEMP_COUNT} |
          | ⏰ Antiguos detectados | ${OLD_COUNT} |
          | 📦 Total detectado | ${TOTAL} |
          | ✅ Eliminados exitosamente | ${DELETED} |
          | ❌ Errores al eliminar | ${FAILED} |
          EOF
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          
          ---
          **Ejecutado:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
