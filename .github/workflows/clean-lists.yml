name: Limpieza de Archivos M3U

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Mostrar estructura del repositorio
        run: |
          echo "📁 Estructura actual del repositorio:"
          tree -L 2 || ls -lah
          echo ""
          echo "📋 Archivos M3U encontrados:"
          find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) -ls
      
      - name: Configurar Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      
      - name: Detectar archivos para limpiar
        id: detect
        run: |
          echo "========================================"
          echo "🔍 INICIANDO DETECCIÓN DE ARCHIVOS"
          echo "========================================"
          
          mkdir -p reports
          
          # Archivos temporales
          echo "Buscando archivos temporales..."
          TEMP_FILES=$(find . -type f \( -name "*-temp-*" -o -name "temp-*" -o -name "*.tmp" \) ! -path "./.git/*" 2>/dev/null)
          TEMP_COUNT=$(echo "$TEMP_FILES" | grep -c . || echo 0)
          
          echo "✅ Temporales encontrados: $TEMP_COUNT"
          if [ "$TEMP_COUNT" -gt 0 ]; then
            echo "$TEMP_FILES"
          fi
          echo ""
          
          # Archivos antiguos (30+ días)
          echo "Buscando archivos M3U antiguos (30+ días)..."
          OLD_M3U=$(find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) -mtime +30 ! -path "./.git/*" 2>/dev/null)
          OLD_COUNT=$(echo "$OLD_M3U" | grep -c . || echo 0)
          
          echo "✅ Antiguos encontrados: $OLD_COUNT"
          if [ "$OLD_COUNT" -gt 0 ]; then
            echo "$OLD_M3U"
          fi
          echo ""
          
          # Total
          TOTAL=$((TEMP_COUNT + OLD_COUNT))
          
          echo "========================================"
          echo "📊 RESUMEN DE DETECCIÓN"
          echo "========================================"
          echo "🗑️  Archivos temporales: $TEMP_COUNT"
          echo "⏰  Archivos antiguos: $OLD_COUNT"
          echo "📦  TOTAL A ELIMINAR: $TOTAL"
          echo "========================================"
          
          # Guardar para siguiente paso
          echo "$TEMP_FILES" > reports/temp_files.txt
          echo "$OLD_M3U" > reports/old_files.txt
          
          # Output
          echo "temp_count=$TEMP_COUNT" >> $GITHUB_OUTPUT
          echo "old_count=$OLD_COUNT" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
      
      - name: 📝 Generar reporte detallado
        if: steps.detect.outputs.total != '0'
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          REPORT="reports/cleanup_report_${TIMESTAMP}.md"
          
          cat > "$REPORT" << EOF
          # 🧹 Reporte de Limpieza Automática
          
          **Fecha:** $(date)
          **Total archivos a eliminar:** ${{ steps.detect.outputs.total }}
          
          ## 📊 Detalles
          
          ### 🗑️ Archivos Temporales (${{ steps.detect.outputs.temp_count }})
          \`\`\`
          $(cat reports/temp_files.txt)
          \`\`\`
          
          ### ⏰ Archivos Antiguos (${{ steps.detect.outputs.old_count }})
          \`\`\`
          $(cat reports/old_files.txt)
          \`\`\`
          EOF
          
          echo "REPORT=$REPORT" >> $GITHUB_ENV
          
          echo "========================================"
          echo "📄 REPORTE GENERADO"
          echo "========================================"
          cat "$REPORT"
      
      - name: 🗑️ Eliminar archivos
        if: steps.detect.outputs.total != '0'
        run: |
          echo "========================================"
          echo "🗑️  INICIANDO ELIMINACIÓN"
          echo "========================================"
          
          DELETED=0
          FAILED=0
          
          # Procesar archivos temporales
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              echo "Eliminando: $file"
              if git rm -f "$file" 2>/dev/null; then
                echo "  ✅ Eliminado"
                ((DELETED++))
              else
                echo "  ❌ Error"
                ((FAILED++))
              fi
            fi
          done < reports/temp_files.txt
          
          # Procesar archivos antiguos
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              echo "Eliminando: $file"
              if git rm -f "$file" 2>/dev/null; then
                echo "  ✅ Eliminado"
                ((DELETED++))
              else
                echo "  ❌ Error"
                ((FAILED++))
              fi
            fi
          done < reports/old_files.txt
          
          echo "========================================"
          echo "📊 RESULTADO DE ELIMINACIÓN"
          echo "========================================"
          echo "✅ Eliminados correctamente: $DELETED"
          echo "❌ Errores: $FAILED"
          echo "========================================"
          
          echo "DELETED=$DELETED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
      
      - name: 💾 Commit y push
        if: steps.detect.outputs.total != '0' && env.DELETED != '0'
        run: |
          git add reports/ || true
          
          git commit -m "🧹 Limpieza automática - $DELETED archivos eliminados" || true
          
          git push || echo "⚠️  No se pudo hacer push"
      
      - name: 📦 Subir reportes
        if: steps.detect.outputs.total != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
      
      - name: ✅ Resumen final
        if: always()
        run: |
          echo "## 🧹 Limpieza de Archivos M3U" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.detect.outputs.total }}" = "0" ]; then
            echo "✅ **No se encontraron archivos para limpiar**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "El repositorio está limpio. No hay archivos temporales ni antiguos." >> $GITHUB_STEP_SUMMARY
          else
            echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🗑️ Temporales | ${{ steps.detect.outputs.temp_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏰ Antiguos | ${{ steps.detect.outputs.old_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Total | ${{ steps.detect.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Eliminados | ${DELETED:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Fallidos | ${FAILED:-0} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ejecutado:** $(date)" >> $GITHUB_STEP_SUMMARY
