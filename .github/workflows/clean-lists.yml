name: Limpieza de Archivos M3U

on:
  schedule:
    - cron: '0 9 * * *'  # Diariamente a las 9 AM
  workflow_dispatch:      # Ejecutar manualmente

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historial completo para análisis
      
      - name: Configurar Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      
      - name: Detectar archivos antiguos y temporales
        id: detect
        run: |
          echo "🔍 Buscando archivos para limpiar..."
          
          # Crear directorio de reportes
          mkdir -p reports
          
          # Archivos a eliminar (más de 30 días sin modificar)
          DAYS_OLD=30
          
          # Buscar archivos temporales
          TEMP_FILES=$(find . -type f \( -name "*-temp-*" -o -name "temp-*" -o -name "*.tmp" \) 2>/dev/null || echo "")
          
          # Buscar archivos M3U antiguos (más de 30 días)
          OLD_M3U=$(find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) -mtime +${DAYS_OLD} 2>/dev/null || echo "")
          
          # Buscar archivos duplicados
          DUPLICATES=$(find . -type f -name "*.m3u" -o -name "*.m3u8" | sort | uniq -d 2>/dev/null || echo "")
          
          # Contar archivos
          TEMP_COUNT=$(echo "$TEMP_FILES" | grep -v '^$' | wc -l)
          OLD_COUNT=$(echo "$OLD_M3U" | grep -v '^$' | wc -l)
          DUP_COUNT=$(echo "$DUPLICATES" | grep -v '^$' | wc -l)
          TOTAL=$((TEMP_COUNT + OLD_COUNT + DUP_COUNT))
          
          echo "temp_count=$TEMP_COUNT" >> $GITHUB_OUTPUT
          echo "old_count=$OLD_COUNT" >> $GITHUB_OUTPUT
          echo "dup_count=$DUP_COUNT" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          
          # Guardar listas para siguiente paso
          echo "$TEMP_FILES" > reports/temp_files.txt
          echo "$OLD_M3U" > reports/old_files.txt
          echo "$DUPLICATES" > reports/duplicate_files.txt
          
          echo "📊 Archivos detectados:"
          echo "  - Temporales: $TEMP_COUNT"
          echo "  - Antiguos (>30 días): $OLD_COUNT"
          echo "  - Duplicados: $DUP_COUNT"
          echo "  - Total: $TOTAL"
      
      - name: Generar reporte detallado
        if: steps.detect.outputs.total != '0'
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          REPORT_FILE="reports/cleanup_report_${TIMESTAMP}.md"
          
          echo "# 🧹 Reporte de Limpieza Automática" > "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "**Fecha:** $(date -Iseconds)" >> "$REPORT_FILE"
          echo "**Repositorio:** ${{ github.repository }}" >> "$REPORT_FILE"
          echo "**Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          
          echo "## 📊 Resumen" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "| Categoría | Cantidad |" >> "$REPORT_FILE"
          echo "|-----------|----------|" >> "$REPORT_FILE"
          echo "| 🗑️ Archivos temporales | ${{ steps.detect.outputs.temp_count }} |" >> "$REPORT_FILE"
          echo "| ⏰ Archivos antiguos | ${{ steps.detect.outputs.old_count }} |" >> "$REPORT_FILE"
          echo "| 📋 Archivos duplicados | ${{ steps.detect.outputs.dup_count }} |" >> "$REPORT_FILE"
          echo "| **📦 Total** | **${{ steps.detect.outputs.total }}** |" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          
          echo "## 📁 Archivos Detectados" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          
          if [ -s reports/temp_files.txt ]; then
            echo "### 🗑️ Archivos Temporales" >> "$REPORT_FILE"
            echo "\`\`\`" >> "$REPORT_FILE"
            cat reports/temp_files.txt >> "$REPORT_FILE"
            echo "\`\`\`" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
          fi
          
          if [ -s reports/old_files.txt ]; then
            echo "### ⏰ Archivos Antiguos (>30 días)" >> "$REPORT_FILE"
            echo "\`\`\`" >> "$REPORT_FILE"
            cat reports/old_files.txt >> "$REPORT_FILE"
            echo "\`\`\`" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
          fi
          
          if [ -s reports/duplicate_files.txt ]; then
            echo "### 📋 Archivos Duplicados" >> "$REPORT_FILE"
            echo "\`\`\`" >> "$REPORT_FILE"
            cat reports/duplicate_files.txt >> "$REPORT_FILE"
            echo "\`\`\`" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
          fi
          
          echo "REPORT_FILE=$REPORT_FILE" >> $GITHUB_ENV
          
          cat "$REPORT_FILE"
      
      - name: Eliminar archivos detectados
        if: steps.detect.outputs.total != '0'
        run: |
          DELETED=0
          FAILED=0
          
          echo "🗑️ Iniciando eliminación de archivos..."
          
          # Eliminar temporales
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              if git rm -f "$file" 2>/dev/null; then
                echo "✅ Eliminado: $file"
                ((DELETED++))
              else
                echo "❌ Error eliminando: $file"
                ((FAILED++))
              fi
            fi
          done < reports/temp_files.txt
          
          # Eliminar antiguos
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              if git rm -f "$file" 2>/dev/null; then
                echo "✅ Eliminado: $file"
                ((DELETED++))
              else
                echo "❌ Error eliminando: $file"
                ((FAILED++))
              fi
            fi
          done < reports/old_files.txt
          
          # Eliminar duplicados
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              if git rm -f "$file" 2>/dev/null; then
                echo "✅ Eliminado: $file"
                ((DELETED++))
              else
                echo "❌ Error eliminando: $file"
                ((FAILED++))
              fi
            fi
          done < reports/duplicate_files.txt
          
          echo "DELETED=$DELETED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          
          echo ""
          echo "📊 Resultado:"
          echo "  ✅ Eliminados: $DELETED"
          echo "  ❌ Fallidos: $FAILED"
      
      - name: Commit cambios
        if: steps.detect.outputs.total != '0' && env.DELETED != '0'
        run: |
          # Agregar reporte
          git add reports/ || true
          
          # Commit
          git commit -m "🧹 Limpieza automática: $DELETED archivos eliminados

          - Temporales: ${{ steps.detect.outputs.temp_count }}
          - Antiguos: ${{ steps.detect.outputs.old_count }}
          - Duplicados: ${{ steps.detect.outputs.dup_count }}
          
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}" || echo "No hay cambios para commitear"
          
          # Push
          git push origin ${{ github.ref_name }} || echo "Error al hacer push"
      
      - name: Subir artefactos
        if: steps.detect.outputs.total != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
      
      - name: Crear issue si hay errores
        if: steps.detect.outputs.total != '0' && env.FAILED != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Limpieza con errores - ${new Date().toISOString().split('T')[0]}`,
              body: `${reportContent}
              
              ---
              
              ## ⚠️ Errores Detectados
              
              - **Archivos fallidos:** ${process.env.FAILED}
              - **Archivos eliminados:** ${process.env.DELETED}
              
              **Acción requerida:** Revisar manualmente los archivos que no pudieron eliminarse.
              
              **Workflow:** [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              labels: ['automated', 'cleanup', 'needs-attention']
            });
      
      - name: Resumen final
        if: always()
        run: |
          echo "## 🧹 Limpieza de Archivos M3U" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.detect.outputs.total }}" = "0" ]; then
            echo "✅ **No se encontraron archivos para limpiar**" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🗑️ Temporales | ${{ steps.detect.outputs.temp_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏰ Antiguos | ${{ steps.detect.outputs.old_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📋 Duplicados | ${{ steps.detect.outputs.dup_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **📦 Total detectado** | **${{ steps.detect.outputs.total }}** |" >> $GITHUB_STEP_SUMMARY
            echo "| **✅ Eliminados** | **${DELETED:-0}** |" >> $GITHUB_STEP_SUMMARY
            echo "| **❌ Fallidos** | **${FAILED:-0}** |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fecha:** $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY
